name: Validate question banks

on:
  push:
    paths: ['js/questions*.js', 'scripts/validate-questions.js', '.github/workflows/validate-questions.yml']
  pull_request:
    paths: ['js/questions*.js', 'scripts/validate-questions.js', '.github/workflows/validate-questions.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-questions.js
